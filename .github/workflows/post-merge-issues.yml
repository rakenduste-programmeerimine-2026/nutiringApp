name: Post-merge issue check

on:
  pull_request:
    types: [closed]
    branches: [main, development]

permissions:
  issues: write
  pull-requests: write

jobs:
  review-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Comment open issues on merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          list=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 30 --json number,title --jq '.[] | "- #\(.number) \(.title)"')
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Merged. Open issues to review for next work:

          ${list:-_none_}"
