<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutiring – nutitelefoni õppeküla</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --navy:#03236A; --blue:#1A3C8B; --mid:#3055AB; --sky:#5984E7; --pale:#EAF0FD;
  --ink:#03236A; --ink2:#46557A; --line:#C9D5F2; --bg:#FFFFFF;
  --good:#1E8E4E; --goodbg:#E5F6EC; --bad:#C62828; --badbg:#FDECEC;
  --yellow:#FFD45C; --mint:#8FE0B5; --lav:#C9BBFF; --peach:#FFBE9F;
  --r:18px;
  font-family:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-size:20px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
#app{min-height:100%}
.hidden{display:none!important}

/* ---------- generic UI ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:64px;padding:14px 28px;
  border-radius:999px;font-weight:800;font-size:22px;background:var(--navy);color:#fff;border:3px solid var(--navy);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.block{display:flex;width:100%}
.btn.small{min-height:52px;font-size:19px;padding:10px 20px}
.btn svg{width:28px;height:28px;flex:none}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:2px solid var(--line);min-height:72px}
.topbar .t{font-weight:800;font-size:21px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backbtn{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:8px 18px 8px 12px;border:3px solid var(--navy);border-radius:999px;font-weight:800;font-size:19px;color:var(--navy);background:#fff;flex:none}
.backbtn svg{width:24px;height:24px}
.logo{display:inline-flex;align-items:center;gap:4px;font-weight:900;color:var(--navy);letter-spacing:-.02em}
.logo .ring{display:inline-flex;align-items:center;justify-content:center;border:.075em solid currentColor;border-radius:50%;width:.95em;height:.95em;margin-left:.06em;letter-spacing:0;flex:none}
.logo .ring span{font-size:.36em;font-weight:800;line-height:1;margin-top:-.08em}

/* ---------- start ---------- */
.start{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;gap:20px}
.start .logo{font-size:84px}
.start .tag{font-size:26px;font-weight:800;max-width:520px}
.start h2{font-size:28px;margin-top:28px}
.oschoice{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.osbtn{width:220px;padding:24px 16px;border:4px solid var(--navy);border-radius:28px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:12px;font-weight:900;font-size:28px;color:var(--navy);transition:transform .1s,background .15s}
.osbtn:hover{background:var(--pale)}
.osbtn:active{transform:scale(.97)}
.osbtn svg{width:70px;height:110px}
.osbtn small{font-size:17px;font-weight:700;color:var(--ink2)}

/* ---------- village ---------- */
.village{max-width:620px;margin:0 auto;padding:16px 16px 60px;position:relative}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 4px 4px}
.vhead .logo{font-size:44px}
.oschip{display:inline-flex;align-items:center;gap:10px;border:3px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px;font-weight:800;font-size:18px}
.oschip button{border-radius:999px;background:var(--pale);color:var(--navy);padding:6px 14px;font-weight:800;font-size:17px}
.vintro{font-size:24px;font-weight:800;text-align:center;margin:18px 0 8px}
.vintro small{display:block;font-size:19px;font-weight:600;color:var(--ink2)}
.vpath{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0}
.houses{position:relative;z-index:1}
.hrow{display:flex;padding:18px 0}
.hrow.r{justify-content:flex-end}
.house{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(300px,68%);border-radius:28px;padding:6px 6px 14px;transition:transform .12s}
.house:hover{transform:translateY(-3px)}
.house:active{transform:scale(.97)}
.house svg{width:100%;height:auto;display:block}
.house .hn{font-size:26px;font-weight:900;color:var(--navy);background:#fff;border:3px solid var(--navy);border-radius:999px;padding:6px 22px;margin-top:-6px}
.house .hs{font-size:17px;font-weight:700;color:var(--ink2)}

/* ---------- lesson screen ---------- */
.lscreen{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:40px;padding:0;min-height:0;position:relative}
.phonewrap{position:relative;height:100%;width:100%;display:flex;justify-content:center}
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
.phscreen{position:absolute;inset:0;overflow:hidden}
.phlayer{position:absolute;inset:0;pointer-events:none;z-index:50}
.guide{display:none}
@media (min-width:900px){
  .stage{padding:20px}
  .phonewrap{width:auto;height:100%;align-items:center}
  .phone{height:min(800px,100%);width:auto;aspect-ratio:9/19.2;border-radius:44px;border:12px solid #1b1f2a;box-shadow:0 20px 50px rgba(3,35,106,.18)}
  .guide{display:block;width:400px;flex:none;align-self:center}
}

/* highlight + card */
.hl{position:absolute;border-radius:16px;pointer-events:none;transition:all .25s ease}
.hl.do{border:4px solid var(--sky);box-shadow:0 0 0 2000px rgba(3,35,106,.38);animation:pulse 1.3s ease-in-out infinite}
.hl.info{border:4px solid var(--navy);box-shadow:0 0 0 2000px rgba(3,35,106,.22)}
@keyframes pulse{0%,100%{outline:0 solid rgba(89,132,231,.6)}50%{outline:12px solid rgba(89,132,231,0)}}
.hl.do{outline-offset:2px}
.card{position:absolute;left:12px;right:12px;pointer-events:auto;border-radius:22px;padding:16px 18px;font-size:20px;line-height:1.35;z-index:60;box-shadow:0 10px 30px rgba(3,35,106,.28)}
.card.do{background:var(--navy);color:#fff;border:3px solid var(--navy)}
.card.info{background:#fff;color:var(--navy);border:4px solid var(--navy)}
.card .badge{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:15px;letter-spacing:.08em;border-radius:999px;padding:4px 12px 4px 8px;margin-bottom:8px}
.card.do .badge{background:#fff;color:var(--navy)}
.card.info .badge{background:var(--navy);color:#fff}
.card .badge svg{width:20px;height:20px}
.card .txt{font-weight:700}
.card .stepn{float:right;font-size:15px;font-weight:800;opacity:.75;margin-top:4px}
.card .next{margin-top:12px;width:100%;min-height:58px;border-radius:999px;background:var(--navy);color:#fff;font-weight:900;font-size:22px}
.card .hint{margin-top:10px;background:#FFF4CC;color:#5B4300;border-radius:12px;padding:8px 12px;font-size:18px;font-weight:800}
.guide .card{position:relative;left:auto;right:auto;top:auto!important;bottom:auto!important}
.guide .gtitle{font-size:18px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.guide .gh{font-size:26px;font-weight:900;margin-bottom:16px}
.guide .gfoot{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.legend{margin-top:22px;border-top:2px solid var(--line);padding-top:14px;font-size:16px;color:var(--ink2);font-weight:700;display:flex;flex-direction:column;gap:8px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:22px;height:22px;border-radius:7px}

/* popups inside phone */
.popup{position:absolute;left:10px;right:10px;top:42px;background:#FFFBEA;border:3px solid #E7B416;border-radius:18px;padding:12px 14px;color:#3D2E00;font-weight:800;font-size:19px;box-shadow:0 8px 20px rgba(0,0,0,.18);z-index:70;display:flex;gap:10px;align-items:center;animation:drop .35s ease}
.popup b{font-size:28px;letter-spacing:.18em;color:#000}
.popup svg{width:30px;height:30px;flex:none}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}

/* start overlay & lesson list */
.ovl{position:absolute;inset:0;background:rgba(3,35,106,.45);pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:10px;z-index:80}
.ovl .startbig{min-height:84px;font-size:26px;padding:16px 34px;box-shadow:0 8px 30px rgba(0,0,0,.25);border-color:#fff}
.lessons{background:#fff;border-radius:24px;width:100%;max-height:100%;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.lessons h3{flex:none;font-size:22px;font-weight:900;padding:4px 4px 6px}
.lbtn{flex:none;display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:62px;border:3px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:800;font-size:19px;color:var(--navy);background:#fff}
.lbtn:hover{border-color:var(--navy);background:var(--pale)}
.lbtn .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.donecard{background:#fff;border-radius:24px;padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;width:100%}
.donecard .big{font-size:30px;font-weight:900}
.donecard svg{width:70px;height:70px;margin:0 auto}

/* ---------- replica phone common ---------- */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;font-family:'Roboto','Nunito',system-ui,sans-serif;color:#1d1d1f}
.ios .ph{font-family:-apple-system,'SF Pro Text','Nunito',system-ui,sans-serif}
.sb{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:15px;font-weight:700;position:relative;z-index:5}
.sb .sbl,.sb .sbr{display:flex;align-items:center;gap:6px;height:100%;padding:0 4px}
.sb svg{height:15px;width:auto;display:block}
.sb.light{color:#fff}
.sb.light svg{fill:#fff}
.ios .sb{height:44px;padding:0 26px}
.sbi{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:2px}
.batt{display:inline-flex;align-items:center;gap:3px;font-size:13px}
.navbar{height:46px;flex:none;display:flex;justify-content:space-around;align-items:center;background:rgba(255,255,255,.0)}
.navbar button{width:64px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:20px}
.navbar svg{width:20px;height:20px}
.navbar.dark svg{fill:#fff;stroke:#fff}
.homeind{height:30px;flex:none;display:flex;align-items:center;justify-content:center}
.homeind i{display:block;width:134px;height:5px;border-radius:3px;background:#111}
.homeind.light i{background:#fff}
.wall{background:linear-gradient(160deg,#9db7f5 0%,#c9d8fb 45%,#f4e9d8 100%)}
.wall-ios{background:linear-gradient(170deg,#7d9df0 0%,#b9c9f7 50%,#f6dccb 100%)}
.home{flex:1;display:flex;flex-direction:column;position:relative}
.home .space{flex:1}
.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:10px 12px}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);padding:3px 0;border-radius:14px}
.app .ic{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.ios .app .ic{border-radius:14px;width:58px;height:58px}
.app .ic svg{width:60%;height:60%}
.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px;margin:0 10px 6px}
.ios .dock{background:rgba(255,255,255,.35);border-radius:30px;backdrop-filter:blur(10px)}
.dock .app span{display:none}
.gsearch{margin:6px 16px 4px;height:46px;border-radius:23px;background:rgba(255,255,255,.92);display:flex;align-items:center;gap:10px;padding:0 16px;color:#555;font-size:15px}
.drawerhandle{display:flex;justify-content:center;padding:6px 0 0}
.drawerhandle span{display:flex;flex-direction:column;align-items:center;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.4);padding:2px 30px;border-radius:12px}
.pagedots{display:flex;justify-content:center;gap:7px;padding:8px 0 10px}
.pagedots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)}
.pagedots i.on{background:#fff}
.searchpill{align-self:center;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.35);backdrop-filter:blur(8px);color:#fff;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;margin-bottom:8px}
.searchpill svg{width:14px;height:14px;stroke:#fff}
.wallempty{position:absolute;left:10%;right:10%;top:18%;height:26%;border-radius:20px}
.clockw{color:#fff;text-align:center;padding-top:26px;text-shadow:0 1px 4px rgba(0,0,0,.25)}
.clockw .t{font-size:54px;font-weight:300;line-height:1}
.clockw .d{font-size:15px;font-weight:600;margin-top:4px}

/* lock & pin */
.lock{flex:1;display:flex;flex-direction:column;align-items:center;color:#fff}
.lock .lt{font-size:78px;font-weight:300;line-height:1;margin-top:40px}
.ios .lock .lt{font-weight:700;font-size:86px;margin-top:20px}
.ios .lock .ld{order:-1;margin-top:24px}
.lock .ld{font-size:18px;font-weight:600;margin-top:8px}
.lock .sp{flex:1}
.swipeup{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;font-weight:700;padding:14px 40px 10px;border-radius:20px;margin-bottom:6px}
.swipeup svg{width:28px;height:28px;stroke:#fff;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pinscr{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 8px}
.pinscr.dark{background:#1c1c1e;color:#fff}
.pinbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;margin-top:10px}
.pinbox .pt{font-size:19px;font-weight:600;text-align:center}
.pinbox .ps{font-size:14px;opacity:.7;text-align:center}
.dots{display:flex;gap:16px;height:24px;align-items:center;margin-top:8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid currentColor}
.dots i.f{background:currentColor}
.pinerr{color:#ff6b6b;font-weight:700;font-size:15px;height:20px}
.numpad{display:grid;grid-template-columns:repeat(3,72px);gap:12px 22px;margin-top:auto;padding:8px 10px 6px;border-radius:16px}
.numpad button{width:72px;height:72px;border-radius:50%;font-size:30px;font-weight:400;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.06);color:inherit;font-family:inherit}
.dark .numpad button{background:rgba(255,255,255,.14)}
.ios .numpad button{background:rgba(255,255,255,.22)}
.numpad button.k-ok{font-size:17px;font-weight:700;background:#1a73e8;color:#fff}
.numpad button.k-txt{background:none;font-size:16px;font-weight:600}
.numpad button:active{filter:brightness(.8)}

/* apps */
.appscr{flex:1;display:flex;flex-direction:column}
.appbar{height:56px;display:flex;align-items:center;padding:0 16px;font-size:20px;font-weight:600;gap:12px}
.camview{flex:1;background:#222 linear-gradient(180deg,#3a4a5e,#1e2530);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px;color:#fff}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.3)}
.applist{flex:1;overflow:auto}
.drawer{flex:1;display:flex;flex-direction:column;background:#f3f5fb}
.ios .drawer{background:linear-gradient(170deg,#7d9df0 0%,#b9c9f7 50%,#f6dccb 100%)}
.drawer .appgrid .app{color:#1d1d1f;text-shadow:none}
.ios .drawer .appgrid .app{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.searchbar{margin:8px 14px;height:48px;border-radius:24px;background:#e3e8f4;display:flex;align-items:center;gap:10px;padding:0 16px;color:#444;font-size:16px}
.ios .searchbar{background:rgba(255,255,255,.55);border-radius:14px;height:44px}
.searchbar svg{width:18px;height:18px;stroke:#555}
.searchbar .q{color:#111;font-weight:600}
.caret{display:inline-block;width:2px;height:1.1em;background:#1a73e8;vertical-align:middle;animation:blink 1s step-end infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.libtitle{font-size:22px;font-weight:800;color:#fff;padding:4px 16px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.results{padding:6px 14px;display:flex;flex-direction:column;gap:6px}
.result{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;background:#fff;font-size:17px;font-weight:600}
.result .ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ios .result .ic{border-radius:10px}
.result .ic svg{width:60%;height:60%}
.ctx{position:absolute;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);min-width:220px;overflow:hidden;z-index:30}
.ctx button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;font-size:17px;font-weight:600;text-align:left;color:#1d1d1f;border-bottom:1px solid #eee}
.ctx button:last-child{border-bottom:none}
.ctx svg{width:20px;height:20px}

/* long-press menu */
.lmenu{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;gap:10px;padding:0 10px;z-index:20}
.lmenu button{background:#fff;border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:#1d1d1f;width:31%;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.lmenu svg{width:26px;height:26px}
.jiggle .appgrid .app,.jiggle .dock .app{animation:jig .25s ease-in-out infinite alternate}
@keyframes jig{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.iosedit{position:absolute;top:44px;left:0;right:0;display:flex;justify-content:space-between;padding:6px 14px;z-index:20}
.iosedit button{background:rgba(255,255,255,.6);backdrop-filter:blur(8px);border-radius:999px;padding:6px 16px;font-size:16px;font-weight:700;color:#111;min-width:44px}
.iosedit .mid{display:flex;gap:8px}
.app .minus{position:absolute;margin:-6px 0 0 -44px;width:22px;height:22px;border-radius:50%;background:#ddd;color:#333;font-size:16px;line-height:20px;text-align:center;font-weight:900}

/* notifications & quick settings */
.shade{flex:1;background:rgba(32,36,48,.92);color:#fff;display:flex;flex-direction:column;padding:6px 12px;gap:10px;overflow:auto}
.ios .shade{background:rgba(40,44,60,.55);backdrop-filter:blur(20px)}
.notif{background:rgba(255,255,255,.95);color:#111;border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.notif .ic{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.ios .notif .ic{border-radius:9px}
.notif .ic svg{width:60%;height:60%}
.notif .nt{font-weight:700;font-size:15px}
.notif .nb{font-size:15px;color:#333}
.notif .nm{font-size:12px;color:#666}
.clearall{align-self:flex-end;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:700}
.nonotif{text-align:center;opacity:.8;margin-top:40px;font-size:17px}
.qsgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ios .qsgrid{grid-template-columns:repeat(4,1fr)}
.tile{border-radius:22px;min-height:64px;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#3b4152;color:#fff;font-size:14px;font-weight:700;text-align:left}
.tile.on{background:#a8c7fa;color:#062e6f}
.tile svg{width:22px;height:22px;flex:none}
.ios .tile{flex-direction:column;justify-content:center;min-height:72px;border-radius:50%;aspect-ratio:1;padding:6px;font-size:10.5px;text-align:center;gap:3px}
.ios .tile.on{background:#fff;color:#0a60ff}
.ios .tile.on.orange{color:#ff9500}
.bright{display:flex;align-items:center;gap:10px;background:#3b4152;border-radius:22px;padding:14px;color:#fff}
.bright .bar{flex:1;height:10px;border-radius:5px;background:#5c6378;position:relative}
.bright .bar i{position:absolute;left:0;top:0;bottom:0;width:65%;background:#a8c7fa;border-radius:5px}

.qimg{display:flex;justify-content:center;margin:6px 0 16px}
.qimg .big{width:110px;height:110px;border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.qimg .big.round{border-radius:50%}
.qimg .big svg{width:62%;height:62%}
.qimg .sms{max-width:440px;width:100%;border:3px solid var(--line);border-radius:22px;padding:12px}
.qimg .sms .from{font-size:15px;font-weight:800;color:var(--ink2);margin-bottom:6px;word-break:break-all}
.qimg .sms .bub{max-width:100%;background:#e9e9eb;font-size:17px;font-family:system-ui,sans-serif}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:3px solid var(--line);border-radius:18px;padding:14px 16px;font-size:21px;font-weight:800;color:var(--navy);background:#fff;min-height:68px}
.opt:hover{border-color:var(--navy)}
.opt .l{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--navy);display:flex;align-items:center;justify-content:center;font-size:18px}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.right .l{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;font-size:20px;font-weight:800;border-radius:16px;padding:12px 16px}
.fb.r{background:var(--goodbg);color:#0d5c30}
.fb.w{background:var(--badbg);color:#8a1c1c}
.score{text-align:center;padding:20px 0}

.score .msg{font-size:26px;font-weight:900;margin:16px 0 22px}

<body>

<script>
/* ================= Nutiring – core ================= */
const S = { os: null };            // chosen system: 'android' | 'ios'
const app = document.getElementById('app');
const isA = () => S.os === 'android';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- icons ---------- */
const sv = (p, vb = '0 0 24 24', extra = '') => `<svg viewBox="${vb}" ${extra} aria-hidden="true">${p}</svg>`;
const st = 'fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"';
const I = {

  home: sv('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', '0 0 24 24', st),
  hand: sv('<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V12m0-.5a1.5 1.5 0 0 1 3 0V16c0 3.3-2.7 6-6 6h-1.5c-2 0-3.4-.8-4.6-2.3L4.5 16a1.6 1.6 0 0 1 2.4-2.1L8 15"/>', '0 0 24 24', st),

  check: sv('<path d="M5 12.5l4.5 4.5L19 7.5"/>', '0 0 24 24', st),
  x: sv('<path d="M6 6l12 12M18 6L6 18"/>', '0 0 24 24', st),
  key: sv('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/>', '0 0 24 24', st),
  list: sv('<path d="M9 6h11M9 12h11M9 18h11M4 6h.1M4 12h.1M4 18h.1"/>', '0 0 24 24', st),
  search: sv('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', '0 0 24 24', st),

  sendIos: sv('<path d="M12 19V6M6 11.5L12 5.5l6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'),

  block: sv('<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>', '0 0 24 24', st),

  wave: sv('<path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>', '0 0 24 24', st),
  bell: sv('<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20.5a2 2 0 0 0 4 0"/>', '0 0 24 24', st),
  lock: sv('<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>', '0 0 24 24', st),
  phoneOff: sv('<path d="M3 15.5c5-5 13-5 18 0l-2.5 2.5-3.5-1.5v-2.7a10 10 0 0 0-6 0v2.7L5.5 18z" fill="currentColor"/>'),
  phoneOn: sv('<path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z" fill="currentColor"/>'),
  globe: sv('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>', '0 0 24 24', st),

/* app icons of the replica phone (generic, not brand logos) */
const APPS = {
  browser: { a: 'Chrome', i: 'Safari', bgA: '#ffffff', bgI: 'linear-gradient(#5ac8fa,#0a7aff)', fgA: '#1a73e8', fgI: '#fff',
    ic: () => isA() ? I.globe : sv('<circle cx="12" cy="12" r="9.5" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M15.5 8.5l-2.2 4.8-4.8 2.2 2.2-4.8z" fill="#fff"/><path d="M13.3 13.3l-4.8 2.2 2.2-4.8z" fill="#ff3b30"/>') },
  camera: { a: 'Kaamera', i: 'Kaamera', bgA: '#5f6368', bgI: 'linear-gradient(#d9d9de,#a3a3aa)', fgA: '#fff', fgI: '#333',
    ic: () => sv('<path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.6"/>', '0 0 24 24', st) },
  settings: { a: 'Seaded', i: 'Seaded', bgA: '#5f6368', bgI: 'linear-gradient(#a6a6ab,#6e6e73)', fgA: '#fff', fgI: '#fff',
    ic: () => sv('<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="6.6"/>', '0 0 24 24', st) },
  messages: { a: 'Sõnumid', i: 'Sõnumid', bgA: '#1a73e8', bgI: 'linear-gradient(#5df27a,#1fc93b)', fgA: '#fff', fgI: '#fff',
    ic: () => sv('<path d="M12 4c5 0 9 3.2 9 7.3s-4 7.2-9 7.2c-1 0-2-.1-2.9-.4L5 20l1-3.5C4.2 15.2 3 13.4 3 11.3 3 7.2 7 4 12 4z" fill="currentColor"/>') },
  phone: { a: 'Telefon', i: 'Telefon', bgA: '#1e8e3e', bgI: 'linear-gradient(#5df27a,#1fc93b)', fgA: '#fff', fgI: '#fff',
    ic: () => I.phoneOn },
  contacts: { a: 'Kontaktid', i: 'Kontaktid', bgA: '#7b61ff', bgI: 'linear-gradient(#e5e5ea,#b8b8bf)', fgA: '#fff', fgI: '#6b6b70',
    ic: () => I.person },
  clock: { a: 'Kell', i: 'Kell', bgA: '#3c4043', bgI: '#111', fgA: '#fff', fgI: '#fff',
    ic: () => sv('<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/>', '0 0 24 24', st) },
  calendar: { a: 'Kalender', i: 'Kalender', bgA: '#4285f4', bgI: '#fff', fgA: '#fff', fgI: '#ff3b30',
    ic: () => sv('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>', '0 0 24 24', st) },
  gallery: { a: 'Galerii', i: 'Fotod', bgA: '#f4b400', bgI: '#fff', fgA: '#fff', fgI: '#ff9500',
    ic: () => I.image },
  calc: { a: 'Kalkulaator', i: 'Kalkulaator', bgA: '#ea8600', bgI: '#333', fgA: '#fff', fgI: '#ff9f0a',
    ic: () => sv('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.1M12 12h.1M16 12h.1M8 16h.1M12 16h.1M16 16h.1"/>', '0 0 24 24', st) },
  store: { a: 'Play pood', i: 'App Store', bgA: '#ffffff', bgI: 'linear-gradient(#19c3fb,#1872f4)', fgA: '#01875f', fgI: '#fff',
    ic: () => sv('<path d="M5 8h14l-1.2 12H6.2zM9 8V6.5a3 3 0 0 1 6 0V8"/>', '0 0 24 24', st) },
  weather: { a: 'Ilm', i: 'Ilm', bgA: '#8ab4f8', bgI: 'linear-gradient(#4fa8ff,#1d6fe0)', fgA: '#fff', fgI: '#fff',
    ic: () => sv('<circle cx="9" cy="10" r="3.5"/><path d="M9 3v1.5M3 10h1.5M4.8 5.8l1 1M13.2 5.8l-1 1M8 20h9a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.5 1A3 3 0 0 0 8 20z"/>', '0 0 24 24', st) },
};
const appName = k => isA() ? APPS[k].a : APPS[k].i;
function appIcon(k, attrs = '', withName = true) {
  const a = APPS[k];
  const bg = isA() ? a.bgA : a.bgI, fg = isA() ? a.fgA : a.fgI;
  return `<div class="app" data-app="${k}" ${attrs}><div class="ic" style="background:${bg};color:${fg}">${a.ic()}</div>${withName ? `<span>${appName(k)}</span>` : ''}</div>`;
}
function appIconRaw(k, cls = 'ic') {
  const a = APPS[k];
  return `<div class="${cls}" style="background:${isA() ? a.bgA : a.bgI};color:${isA() ? a.fgA : a.fgI}">${a.ic()}</div>`;
}

/* status bar icons */
const SB = {

  wifi: sv('<path d="M11 19.5l3-3.7a4.7 4.7 0 0 0-6 0zM4.5 11.6a10 10 0 0 1 13 0l1.9-2.4a13 13 0 0 0-16.8 0zM6.6 14.3a6.7 6.7 0 0 1 8.8 0l1.9-2.3a9.6 9.6 0 0 0-12.6 0z" fill="currentColor"/>', '0 0 22 22'),
  batt: sv('<rect x="1" y="5" width="20" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="7" width="13.5" height="8" rx="1.5" fill="currentColor"/><rect x="22" y="9" width="2" height="4" rx="1" fill="currentColor"/>', '0 0 25 22'),

function statusBar(light = false, aAll = '', aL = '', aR = '') {

/* ---------- logo ---------- */
const logo = () => `<span class="logo">Nuti<span class="ring"><span>ring</span></span></span>`;

/* ---------- routing ---------- */
let cleanup = null;
function go(view, arg) {
  if (cleanup) { cleanup(); cleanup = null; }
  window.scrollTo(0, 0);
  ({ start: viewStart, village: viewVillage, home: () => openLessonHouse(HOME), msg: () => openLessonHouse(MSG), cyber: viewCyber, exam: viewExam })[view](arg);
}
const topbar = (title, extra = '') => `<header class="topbar"><button class="backbtn" data-go="village" aria-label="Tagasi külasse">${I.back}<span class="lg">Tagasi külasse</span><span class="sm">Küla</span></button><div class="t">${title}</div>${extra}</header>`;
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) go(g.dataset.go);
});

/* ---------- start screen ---------- */
function viewStart() {
  const phoneSvg = os => os === 'android'
    ? `<svg viewBox="0 0 70 110"><rect x="4" y="2" width="62" height="106" rx="12" fill="#fff" stroke="#03236A" stroke-width="4"/><rect x="10" y="12" width="50" height="82" rx="4" fill="#C9D8FB"/><circle cx="35" cy="7" r="2" fill="#03236A"/><path d="M22 101h6M33 101h4M42 101h6" stroke="#03236A" stroke-width="3" stroke-linecap="round"/></svg>`

    ${logo()}
    <p class="tag">Aitame sul nutitelefoniga sõbraks saada.</p>
    <h2>Millist telefoni sa kasutad?</h2>
    <div class="oschoice">
      <button class="osbtn" data-os="android">${phoneSvg('android')}Android<small>Samsung, Xiaomi, Pixel jt</small></button>
      <button class="osbtn" data-os="ios">${phoneSvg('ios')}iPhone<small>Apple'i telefon</small></button>
    </div>
  </main>`;
  $$('.osbtn').forEach(b => b.onclick = () => { S.os = b.dataset.os; go('village'); });
}

function houseSvg(kind) {
  const grass = `<ellipse cx="150" cy="228" rx="140" ry="20" fill="#A8DB8A"/><circle cx="58" cy="214" r="13" fill="#7CC765"/><circle cx="244" cy="214" r="13" fill="#7CC765"/>`;
  if (kind === 'home') return `<svg viewBox="0 0 300 250">${grass}
    <rect x="66" y="96" width="168" height="124" rx="22" fill="#FFE08A"/>
    <path d="M50 108 L150 30 L250 108 Q256 116 246 118 L54 118 Q44 116 50 108z" fill="#F5B82E"/>
    <rect x="196" y="40" width="24" height="44" rx="6" fill="#F5B82E"/><rect x="190" y="34" width="36" height="12" rx="6" fill="#E9A51C"/>
    <rect x="104" y="58" width="92" height="46" rx="10" fill="#fff"/>
    ${[0, 1, 2].map(r => [0, 1, 2].map(c => `<rect x="${116 + c * 26}" y="${63 + r * 13}" width="16" height="9" rx="3" fill="${['#5984E7', '#7CC765', '#FF8A65'][(r + c) % 3]}"/>`).join('')).join('')}

function startLesson(i) {

const step = () => L.lesson && L.lesson.steps[L.i];
function showStep() {
  const s = step(); L.hint = false; L.pending = false;

  if (s.type === 'do' && s.check && s.check()) { L.pending = true; later(next, 600); }
}
function drawStep() {
  const s = step(); if (!s || L.mode !== 'run') return;

function targets() {
  const s = step(); if (!s || !s.target) return [];
  const sel = typeof s.target === 'function' ? s.target() : s.target;
  return $$(sel, $('#ph'));
}
function place() {
  if (L.mode !== 'run') return;
  const ph = $('#phone'), hl = $('#hl'); if (!ph || !hl) return;
  const pr = ph.getBoundingClientRect();
  const bw = parseFloat(getComputedStyle(ph).borderLeftWidth) || 0;
  const st1 = step();
  const els = targets().concat(st1 && st1.show ? $$(st1.show, $('#ph')) : []);
  let r = null;
  els.forEach(e => { const b = e.getBoundingClientRect(); if (!b.width && !b.height) return;
    r = r ? { l: Math.min(r.l, b.left), t: Math.min(r.t, b.top), r: Math.max(r.r, b.right), b: Math.max(r.b, b.bottom) } : { l: b.left, t: b.top, r: b.right, b: b.bottom }; });
  const W = pr.width - 2 * bw, Hh = pr.height - 2 * bw;
  if (r) {
    const pad = 4;
    const x = Math.max(2, r.l - pr.left - bw - pad), y = Math.max(2, r.t - pr.top - bw - pad);
    const w = Math.min(W - x - 2, r.r - r.l + pad * 2), h = Math.min(Hh - y - 2, r.b - r.t + pad * 2);
    Object.assign(hl.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    hl.classList.remove('hidden');
  } else hl.classList.add('hidden');
  const card = $('#card', layer());
  if (card) {
    card.style.top = card.style.bottom = '';
    const s = step();
    if (s && s.cardAt === 'top') card.style.top = '36px';
    else if (s && s.cardAt === 'bottom') card.style.bottom = '8px';
    else if (r) {
      const top = r.t - pr.top - bw, bot = r.b - pr.top - bw;
      const ch = card.offsetHeight;
      if ((top + bot) / 2 > Hh / 2 || bot + 14 + ch > Hh) card.style.bottom = Math.min(Hh - ch - 4, Math.max(4, Hh - top + 14)) + 'px';
      else card.style.top = Math.max(4, bot + 14) + 'px';
      if (card.style.bottom && Hh - parseFloat(card.style.bottom) - ch < 0) { card.style.bottom = ''; card.style.top = '4px'; }
    } else card.style.top = Math.max(10, (Hh - card.offsetHeight) / 2) + 'px';
  }
}
function next() { const s = step(); if (s && s.leave) s.leave(); L.i++; showStep(); }
function finishLesson() {
  L.mode = 'done';
  const last = L.li >= L.house.lessons.length - 1;
  layer().innerHTML = `<div class="ovl"><div class="donecard">
    <svg viewBox="0 0 70 70"><circle cx="35" cy="35" r="33" fill="#E5F6EC"/><path d="M20 36l10 10 20-22" fill="none" stroke="#1E8E4E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>

/* events from phone UI */
function emit(ev) {
  const s = step();
  if (L.mode === 'run' && !L.pending && s && s.type === 'do' && (s.until === ev || (Array.isArray(s.until) && s.until.includes(ev)))) { L.pending = true; later(next, 350); return true; }
  return false;
}
function checkStep() {
  const s = step();
  if (L.mode === 'run' && !L.pending && s && s.type === 'do' && s.check && s.check()) { L.pending = true; later(next, 450); }

/* ---------- pointer handling with gating ---------- */
function allowed(el) {
  if (L.mode !== 'run' || L.pending) return false;
  const s = step(); if (!s || s.type !== 'do') return false;
  return targets().some(t => t === el || t.contains(el));
}
function blocked() {
  const s = step(); if (L.pending) return;
  if (L.mode === 'run' && s && s.type === 'do') { L.hint = true; drawStep(); }
}
function bindPhone() {
  const ph = $('#ph');
  let p = null;
  ph.addEventListener('pointerdown', e => {
    const el = e.target.closest('[data-act],[data-long],[data-swipe]');
    if (!allowed(e.target)) { blocked(); p = null; return; }
    if (!el) { p = null; return; }
    p = { el, x: e.clientX, y: e.clientY, fired: false, id: e.pointerId };
    try { ph.setPointerCapture(e.pointerId); } catch (_) { }
    if (el.dataset.long) p.t = setTimeout(() => { p && (p.fired = true); doAct(el.dataset.long, el); }, 550);
  });
  ph.addEventListener('pointerup', e => {
    if (!p) return; clearTimeout(p.t);
    const q = p; p = null; if (q.fired) return;
    const dx = e.clientX - q.x, dy = e.clientY - q.y, el = q.el, sw = el.dataset.swipe;
    const moved = Math.hypot(dx, dy) > 14;
    if (sw && moved) {
      const ok = (sw === 'up' && dy < -25) || (sw === 'down' && dy > 25) || (sw === 'left' && dx < -25) || (sw === 'right' && dx > 25);
      if (ok) doAct(el.dataset.swipeAct || el.dataset.act, el);
      return;
    }
    const st0 = step();
    const wantsLong = el.dataset.long && st0 && (st0.until === el.dataset.long);
    if (!moved && el.dataset.act && !wantsLong) doAct(el.dataset.act, el);
    else if (!moved && wantsLong) { L.hint = true; st0.hint = st0.hint || 'Hoia sõrme kauem all, umbes üks sekund.'; drawStep(); }
    else if (!moved && el.dataset.long) { L.hint = true; const s = step(); if (s) { s.hint = s.hint || 'Hoia sõrme kauem all, umbes üks sekund.'; drawStep(); } }
  });
  ph.addEventListener('pointercancel', () => { if (p) clearTimeout(p.t); p = null; });
  ph.addEventListener('contextmenu', e => e.preventDefault());
}
function doAct(name, el) {
  const ev = L.house.act(name, el);
  renderPhone();
  emit(name);
  if (ev) emit(ev);
  checkStep();
}
function physKey(e) {
  if (L.mode !== 'run' || !L.house.kbOpen || !L.house.kbOpen()) return;
  const s = step(); if (!s || s.type !== 'do') return;
  const kb = $('#ph .kb'); if (!kb || !targets().some(t => t === kb || t.contains(kb) || kb.contains(t))) return;
  let k = null;
  if (e.key === 'Backspace') k = 'bksp'; else if (e.key === ' ') k = 'space'; else if (e.key === 'Enter') k = 'enter';
  else if (e.key.length === 1) k = 'ch:' + e.key;
  if (!k) return;
  e.preventDefault();
  doAct('key', { dataset: { k } });
}

/* shared replica keyboard (Estonian layout) */
function keyboard(K) {
  // K = {shift, mode:'abc'|'123'|'emoji', emojiKey:bool}
  if (K.mode === 'emoji') {
    const em = ['😀', '😂', '😊', '😍', '👍', '🙏', '❤️', '🌷', '🎉', '☀️', '😢', '😮', '👋', '🤗', '🎂', '☕', '🐶', '🌲'];
    return `<div class="kb"><div class="emojigrid">${em.map(x => `<button data-act="emojiPick" data-e="${x}">${x}</button>`).join('')}</div>
      <div class="krow"><button class="key wide" data-act="key" data-k="abc">ABC</button><button class="key space" data-act="key" data-k="space">tühik</button><button class="key wide" data-act="key" data-k="bksp">${sv('<path d="M9 5h11v14H9l-6-7zM12 9l6 6M18 9l-6 6"/>', '0 0 24 24', st)}</button></div></div>`;
  }
  const rows = K.mode === '123'
    ? [['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'], ['@', '#', '€', '&', '-', '+', '(', ')', '/'], ['*', '"', "'", ':', ';', '!', '?']]
    : [['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p', 'ü', 'õ'], ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'ö', 'ä'], ['z', 'x', 'c', 'v', 'b', 'n', 'm']];
  const kk = c => { const d = K.shift ? c.toUpperCase() : c; return `<button class="key" data-act="key" data-k="ch:${esc(d)}">${esc(d)}</button>`; };
  const shiftIc = sv('<path d="M12 4l8 8h-4.5v7h-7v-7H4z" ' + (K.shift ? 'fill="currentColor"' : 'fill="none"') + ' stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>');
  const bk = `<button class="key wide" data-act="key" data-k="bksp" aria-label="Kustuta">${sv('<path d="M9 5h11v14H9l-6-7zM12 9l6 6M18 9l-6 6"/>', '0 0 24 24', st)}</button>`;
  return `<div class="kb">
    <div class="krow">${rows[0].map(kk).join('')}</div>
    <div class="krow">${rows[1].map(kk).join('')}</div>
    <div class="krow">${K.mode === 'abc' ? `<button class="key wide ${K.shift ? 'on' : ''}" data-act="key" data-k="shift" aria-label="Suurtäht">${shiftIc}</button>` : ''}${rows[2].map(kk).join('')}${bk}</div>
    <div class="krow"><button class="key wide" data-act="key" data-k="${K.mode === 'abc' ? 'mode123' : 'abc'}">${K.mode === 'abc' ? '123' : 'ABC'}</button>${K.emojiKey ? `<button class="key wide" data-act="key" data-k="emoji" aria-label="Emotikonid">${I.smile}</button>` : `<button class="key" data-act="key" data-k="ch:,">,</button>`}<button class="key space" data-act="key" data-k="space">tühik</button><button class="key" data-act="key" data-k="ch:.">.</button><button class="key wide" data-act="key" data-k="enter" aria-label="Reavahetus">↵</button></div>
  </div>`;
}
/* apply a keyboard key to a text value; returns {text, K} */
function applyKey(k, text, K) {
  if (k === 'shift') K.shift = !K.shift;
  else if (k === 'mode123') K.mode = '123';
  else if (k === 'abc') K.mode = 'abc';
  else if (k === 'emoji') K.mode = 'emoji';
  else if (k === 'bksp') text = [...text].slice(0, -1).join('');
  else if (k === 'space') text += ' ';
  else if (k && k.startsWith('ch:')) { text += k.slice(3); if (K.shift) K.shift = false; }
  return text;
}

const DRAWER = ['phone', 'browser', 'gallery', 'calc', 'calendar', 'camera', 'clock', 'contacts', 'weather', 'store', 'settings', 'messages'];
let P = {};
const pad = (enter) => `<div class="numpad">${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(d => `<button data-act="pad" data-d="${d}">${d}</button>`).join('')}
  <button data-act="pad" data-d="del" class="k-txt" aria-label="Kustuta">⌫</button><button data-act="pad" data-d="0">0</button>${enter ? `<button data-act="pad" data-d="ok" class="k-ok">OK</button>` : '<button class="k-txt" tabindex="-1"></button>'}</div>`;
const dots = (v, n = 4) => `<div class="dots">${Array.from({ length: n }, (_, i) => `<i class="${i < v.length ? 'f' : ''}"></i>`).join('')}</div>`;

const HOME = {
  title: 'Avaekraan',
  reset() {
    P = { scr: 'home', pin: '', pass: '', err: '', homeApps: ['settings', 'contacts'], dockApps: ['phone', 'messages', 'browser', 'camera'], notifs: true,
      qs: { wifi: true, data: true, torch: false, silent: false, rotate: false, plane: false }, q: '', K: { shift: false, mode: 'abc' }, ctx: null, sb: '' };
  },
  preStart() { P.scr = 'sim'; },
  kbOpen() { return P.scr === 'search'; },

  render() {
    const A = isA();
    const sbAll = A && P.sb ? `data-act="${P.sb}" data-swipe="down"` : '';
    const sbL = !A && P.sb === 'openNotif' ? 'data-act="openNotif" data-swipe="down"' : '';
    const sbR = !A && P.sb === 'openQS' ? 'data-act="openQS" data-swipe="down"' : '';
    const sb = (light) => statusBar(light, sbAll, sbL, sbR);
    const nav = (dark) => navBar(dark);
    switch (P.scr) {
      case 'sim':
        return `<div class="ph" style="background:${A ? '#fff' : '#1c1c1e'}">${statusBar(!A)}
          <div class="pinscr ${A ? '' : 'dark'}"><div class="pinbox">
            ${A ? sv('<rect x="6" y="2" width="12" height="20" rx="2" fill="none" stroke="#1a73e8" stroke-width="2"/><path d="M9 7h6v6H9z" fill="#1a73e8"/>', '0 0 24 24', 'style="width:34px;height:34px"') : ''}
            <div class="pt">${A ? 'Sisesta SIM-kaardi PIN-kood' : 'SIM PIN'}</div>
            <div class="ps">${A ? 'Telefoni kasutamiseks' : 'Sisesta SIM-kaardi PIN-kood'}</div>
            ${dots(P.pin)}<div class="pinerr">${P.err}</div></div>
            ${pad(true)}</div>${A ? nav(false) : '<div class="homeind light"><i></i></div>'}</div>`;
      case 'lock':
        return `<div class="ph ${A ? 'wall' : 'wall-ios'}">${statusBar(true)}
          <div class="lock"><div class="lt lock-time">10:24</div><div class="ld lock-date">teisipäev, 17. november</div><div class="sp"></div>
          <div class="swipeup" data-act="unlock" data-swipe="up">${I.up.replace('<svg', '<svg stroke="#fff"')}<span>${A ? 'Avamiseks pühkige üles' : 'Pühi avamiseks üles'}</span></div></div>
          ${A ? nav(true) : '<div class="homeind light"><i></i></div>'}</div>`;
      case 'pass':
        return `<div class="ph ${A ? 'wall' : 'wall-ios'}" style="color:#fff">${statusBar(true)}
          <div class="pinscr" style="background:rgba(0,0,0,.25)"><div class="pinbox">
            ${I.lock.replace('<svg', '<svg style="width:30px;height:30px"')}
            <div class="pt">${A ? 'Sisesta PIN-kood' : 'Sisesta pääsukood'}</div>${dots(P.pass)}<div class="pinerr">${P.err}</div></div>
            ${pad(A)}</div>${A ? nav(true) : '<div class="homeind light"><i></i></div>'}</div>`;
      case 'home': case 'longmenu': case 'jiggle':
        return this.homeScreen(sb);
      case 'drawer': case 'search':
        return this.drawer(sb);
      case 'notif':
        return `<div class="ph ${A ? 'wall' : 'wall-ios'}">${statusBar(true)}<div class="shade">
          <div style="font-size:${A ? 15 : 40}px;font-weight:${A ? 600 : 700};${A ? '' : 'text-align:center'}">${A ? 'teisipäev, 17. nov' : '10:24'}</div>
          ${P.notifs ? `
          <div class="notif n1">${appIconRaw('messages')}<div><div class="nm">${appName('messages')} · 10:12</div><div class="nt">Mari Tamm</div><div class="nb">Kas tuled pühapäeval lõunale?</div></div></div>
          <div class="notif n2">${appIconRaw('weather')}<div><div class="nm">Ilm · 8:00</div><div class="nt">Täna sajab vihma</div><div class="nb">Võta vihmavari kaasa.</div></div></div>
          <button class="clearall" data-act="clearNotif">${A ? 'Kustuta kõik' : 'Tühjenda kõik'}</button>`
          : `<div class="nonotif">Teavitusi pole</div>`}
          </div>${nav(true)}</div>`;
      case 'qs': return this.qs();
      default: {
        const k = P.scr.slice(4);
        if (k === 'camera') return `<div class="ph" style="background:#000">${statusBar(true)}<div class="camview"><div style="flex:1;display:flex;align-items:center;font-size:18px;opacity:.8">Kaamera vaade</div><div class="shutter"></div></div>${nav(true)}</div>`;
        return `<div class="ph" style="background:#fff">${statusBar(false)}<div class="appscr"><div class="appbar">${appIconRaw(k, 'ic')}${appName(k)}</div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:${k === 'clock' ? 64 : 20}px;color:#333">${k === 'clock' ? '10:24' : appName(k)}</div></div>${nav(false)}</div>`;
      }
    }
  },
  homeScreen(sb) {
    const A = isA(), jig = P.scr === 'jiggle';
    const grid = P.homeApps.map(k => appIcon(k, `data-act="open"`)).join('');
    const minus = jig ? '' : '';
    return `<div class="ph ${A ? 'wall' : 'wall-ios'} ${jig ? 'jiggle' : ''}">${sb(true)}
      <div class="home">
        ${A ? `<div class="clockw"><div class="t">10:24</div><div class="d">teisipäev, 17. november · 8°C</div></div>` : ''}
        <div class="appgrid homegrid" style="${A ? 'margin-top:auto' : ''}">${grid}</div>
        <div class="wallempty" data-long="longHome" style="${A ? 'top:30%' : 'top:22%'}"></div>
        <div class="space"></div>
        ${A ? `<div class="drawerhandle" data-act="openDrawer" data-swipe="up"><span>${I.up.replace('<svg', '<svg style="width:22px;height:22px;stroke:#fff"')}Kõik rakendused</span></div>`
          : `<button class="searchpill" data-act="searchFocus">${I.search}Otsi</button><div class="pagedots" data-act="openDrawer" data-swipe="left"><i class="on"></i><i></i></div>`}
        <div class="dock">${P.dockApps.map(k => appIcon(k, `data-act="open"`, false)).join('')}</div>
      </div>
      ${P.scr === 'longmenu' ? `<div data-act="closeMenu" class="menuclose" style="position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.25)"></div>
        <div class="lmenu">
          <button class="lm lm-wall">${I.image}Taustapilt ja stiil</button>
          <button class="lm lm-widg">${sv('<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>', '0 0 24 24', st)}Vidinad</button>
          <button class="lm lm-set">${APPS.settings.ic()}Avaekraani seaded</button></div>` : ''}
      ${jig ? `<div class="iosedit"><button class="ie-plus">+</button><div class="mid"><button class="ie-edit">Muuda</button></div><button class="ie-done" data-act="closeMenu">Valmis</button></div>` : ''}
      ${navBar(true)}</div>`;
  },
  drawer(sb) {
    const A = isA(), srch = P.scr === 'search';
    const names = DRAWER.slice().sort((a, b) => appName(a).localeCompare(appName(b), 'et'));
    const q = P.q.trim().toLowerCase();
    const res = q ? names.filter(k => appName(k).toLowerCase().includes(q)) : [];
    const field = `<div class="searchbar" data-act="searchFocus">${I.search}${srch ? `<span class="q">${esc(P.q)}</span><span class="caret"></span>` : `<span>${A ? 'Otsi rakendusi' : 'Rakenduste kogu'}</span>`}</div>`;
    let body;
    if (srch) body = `<div class="results">${q ? (res.length ? res.map(k => `<button class="result" data-act="open" data-app="${k}" data-result="${k}">${appIconRaw(k)}<span>${appName(k)}</span></button>`).join('') : '<div style="padding:10px;color:#555">Tulemusi pole</div>') : `<div style="padding:10px;color:${A ? '#555' : '#fff'};font-size:15px">Kirjuta rakenduse nimi</div>`}</div><div style="flex:1"></div>${keyboard(P.K)}`;
    else body = `${A ? '' : '<div class="libtitle">Rakenduste kogu</div>'}<div class="appgrid" style="overflow:auto">${names.map(k => appIcon(k, `data-act="open" ${k === 'clock' ? 'data-long="longApp" data-dapp="clock"' : ''}`)).join('')}</div><div style="flex:1"></div>`;
    const ctx = P.ctx ? `<div data-act="ctxClose" style="position:absolute;inset:0;z-index:25"></div><div class="ctx" style="left:50%;top:40%;transform:translateX(-50%)"><button class="ctx-add" data-act="addHome">${I.home}${A ? 'Lisa avaekraanile' : 'Lisa avakuvale'}</button><button>${I.info}Rakenduse teave</button></div>` : '';
    return `<div class="ph" style="${A ? 'background:#f3f5fb' : ''}"><div class="drawer" style="position:relative">${sb(!A)}${field}${body}${ctx}</div>${A ? navBar(false) : '<div class="homeind light" data-act="navHome" data-swipe="up" style="position:absolute;bottom:0;left:0;right:0"><i></i></div>'}</div>`;
  },
  qs() {
    const A = isA(), q = P.qs;
    const t = (k, label, icon, cls = '') => `<button class="tile ${q[k] ? 'on' : ''} ${cls}" data-act="tile" data-tile="${k}">${icon}<span>${label}${A ? `<br><small style="font-weight:500;opacity:.8">${q[k] ? 'Sees' : 'Väljas'}</small>` : ''}</span></button>`;
    const ic = {
      wifi: SB.wifi, data: sv('<path d="M7 20V8M3.5 11.5L7 8l3.5 3.5M17 4v12M13.5 12.5L17 16l3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'),
      torch: sv('<path d="M8 2h8v4l-2 4v12h-4V10L8 6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'),
      silent: sv('<path d="M6 16V11a6 6 0 0 1 9-5.2M18 11v5l2 2H8M10 20.5a2 2 0 0 0 4 0M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'),
      rotate: sv('<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'),
      plane: SB.plane,
    };
    const bright = `<div class="bright">${sv('<circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>')}<div class="bar"><i></i></div></div>`;
    const tiles = A
      ? t('wifi', 'Wi-Fi', ic.wifi) + t('data', 'Mobiilne andmeside', ic.data) + t('torch', 'Taskulamp', ic.torch) + t('silent', 'Vaikne režiim', ic.silent) + t('rotate', 'Automaatne pööramine', ic.rotate) + t('plane', 'Lennurežiim', ic.plane)
      : t('plane', 'Lennu&shy;režiim', ic.plane, 'orange') + t('data', 'Andme&shy;side', ic.data) + t('wifi', 'Wi-Fi', ic.wifi) + t('rotate', 'Pööra&shy;mis&shy;lukk', ic.rotate) + t('torch', 'Tasku&shy;lamp', ic.torch) + t('silent', 'Vaikne režiim', ic.silent);
    const torchOn = q.torch ? '<div style="position:absolute;top:0;left:0;right:0;height:80px;background:radial-gradient(ellipse at top,rgba(255,250,200,.6),transparent 70%);pointer-events:none"></div>' : '';
    return `<div class="ph ${A ? 'wall' : 'wall-ios'}">${statusBar(true)}<div class="shade" style="position:relative">${torchOn}
      ${A ? `${bright.replace('class="bright"', 'class="bright t-bright"')}<div class="qsgrid">${tiles}</div>`
        : `<div style="display:flex;gap:10px;align-items:flex-start"><div class="qsgrid" style="flex:1;grid-template-columns:repeat(3,1fr)">${tiles}</div>${bright.replace('class="bright"', 'class="bright t-bright"')}</div>`}
      </div>${navBar(true)}</div>`;
  },

  act(name, el) {
    const A = isA(), d = el.dataset || {};
    switch (name) {
      case 'pad': {
        const f = P.scr === 'sim' ? 'pin' : 'pass', code = P.scr === 'sim' ? '1234' : '2580';
        P.err = '';
        if (d.d === 'del') P[f] = P[f].slice(0, -1);
        else if (d.d === 'ok') {
          if (P[f] === code) { const was = P.scr; P[f] = ''; P.scr = was === 'sim' ? 'lock' : 'home'; return was === 'sim' ? 'simOk' : 'passOk'; }
          P.err = 'Vale kood. Proovi uuesti.'; P[f] = '';
        } else if (P[f].length < 4) {
          P[f] += d.d;
          if (!A && P.scr === 'pass' && P[f].length === 4) {
            if (P[f] === code) { P[f] = ''; P.scr = 'home'; return 'passOk'; }
            P.err = 'Vale kood. Proovi uuesti.'; P[f] = '';
          }
        }
        return;
      }
      case 'unlock': P.scr = 'pass'; return;
      case 'longHome': P.scr = A ? 'longmenu' : 'jiggle'; return;
      case 'closeMenu': P.scr = 'home'; return;
      case 'open': { const k = el.closest('[data-app]').dataset.app; P.scr = 'app:' + k; P.ctx = null; return 'open:' + k; }
      case 'navHome': P.scr = 'home'; P.ctx = null; return 'goHome';
      case 'navBack': if (P.scr !== 'home') P.scr = P.scr === 'search' ? 'drawer' : 'home'; return 'goHome';
      case 'navRecent': return;
      case 'openDrawer': P.scr = 'drawer'; return;
      case 'searchFocus': P.scr = 'search'; return;
      case 'key': P.q = applyKey(d.k, P.q, P.K); if (d.k === 'enter') P.K.mode = 'abc'; return;
      case 'openNotif': P.scr = 'notif'; return;
      case 'clearNotif': P.notifs = false; return;
      case 'openQS': P.scr = 'qs'; return;
      case 'tile': P.qs[d.tile] = !P.qs[d.tile]; return 'tile:' + d.tile;
      case 'longApp': P.ctx = 'clock'; return;
      case 'ctxClose': P.ctx = null; return;
      case 'addHome': P.ctx = null; if (!P.homeApps.includes('clock')) P.homeApps.push('clock'); P.scr = 'home'; return;
    }
  },

  lessons: [
    { t: 'SIM-kaardi PIN ja telefoni avamine', setup() { P.scr = 'sim'; }, steps: [
      { type: 'info', target: '.pinbox', text: 'Telefon on sisse lülitatud ja küsib <b>SIM-kaardi PIN-koodi</b>. Päris telefonis on see kood kirjas SIM-kaardi ümbrisel.' },
      { type: 'do', target: '.numpad', cardAt: 'top', popup: 'Sinu harjutus-SIM-PIN on <b>1234</b>', text: 'Sisesta numbritega <b>1 2 3 4</b> ja vajuta <b>OK</b>.', until: 'simOk', hint: 'Vajuta numbreid 1, 2, 3, 4 ja siis OK.' },
      { type: 'info', target: '.lock-time, .lock-date', text: 'See on <b>lukustuskuva</b>. Siin näed kellaaega ja kuupäeva ka siis, kui telefon on lukus.' },
      { type: 'do', target: '.swipeup', text: 'Pane sõrm ekraani alaossa ja <b>pühi üles</b>. Võid ka lihtsalt vajutada.', until: 'unlock' },
      { type: 'do', target: '.numpad', cardAt: 'top', popup: () => 0, text: () => isA() ? 'Sisesta ekraaniluku kood <b>2 5 8 0</b> ja vajuta <b>OK</b>.' : 'Sisesta pääsukood <b>2 5 8 0</b>.', until: 'passOk', hint: 'Vajuta numbreid 2, 5, 8, 0.' },
      { type: 'info', target: '.home', text: 'Telefon on lahti! See on <b>avaekraan</b>. Siit avad kõik rakendused.' },
    ] },
    { t: 'Mis on ekraani ülaosas?', steps: [
      { type: 'info', target: '.sb', text: 'Ekraani kõige ülemises reas on <b>olekuriba</b>. Väikesed ikoonid näitavad telefoni olekut.' },
      { type: 'info', target: '.sb-time', text: '<b>Kellaaeg.</b> Siit näed alati, mis kell on.' },
      { type: 'info', target: '.sb-signal', text: '<b>Mobiililevi.</b> Mida rohkem pulki, seda parem on levi helistamiseks.' },
      { type: 'info', target: '.sb-wifi', text: '<b>Wi-Fi.</b> See märk tähendab, et telefon on ühendatud traadita internetiga.' },
      { type: 'info', target: '.sb-batt', text: () => isA() ? '<b>Aku.</b> Number näitab, kui palju akut on alles. Kui see on väike, pane telefon laadima.' : '<b>Aku.</b> Täis kast tähendab täis akut. Kui kast on peaaegu tühi, pane telefon laadima.' },
    ] },
    { t: 'Pikk puudutus avaekraanil', steps: [
      { type: 'do', target: '.wallempty', text: '<b>Hoia sõrme</b> ekraanil tühjal kohal umbes üks sekund, kuni midagi muutub.', until: 'longHome', hint: 'Hoia sõrme all, ära lase kohe lahti.' },
      { type: 'info', os: 'android', target: '.lmenu', text: 'Avanes <b>menüü</b>. Siin saad muuta avaekraani välimust.' },
      { type: 'info', os: 'android', target: '.lm-wall', text: '<b>Taustapilt ja stiil:</b> vali ekraani taustale uus pilt ja värvid.' },
      { type: 'info', os: 'android', target: '.lm-widg', text: '<b>Vidinad:</b> väikesed aknad avaekraanil, näiteks kell, ilm või kalender.' },
      { type: 'info', os: 'android', target: '.lm-set', text: '<b>Avaekraani seaded:</b> näiteks ikoonide suurus ja paigutus.' },
      { type: 'do', os: 'android', target: '.menuclose', text: 'Menüü sulgemiseks <b>vajuta tühjale kohale</b> ekraanil.', until: 'closeMenu' },
      { type: 'info', os: 'ios', target: '.homegrid, .dock', text: 'Ikoonid hakkasid <b>värisema</b>. Nüüd saad avakuva muuta.' },
      { type: 'info', os: 'ios', target: '.ie-plus', text: '<b>Pluss (+):</b> lisa avakuvale vidin, näiteks kell, ilm või kalender.' },
      { type: 'info', os: 'ios', target: '.ie-edit', text: '<b>Muuda:</b> vaheta taustapilti ja avakuva kujundust.' },
      { type: 'do', os: 'ios', target: '.ie-done', text: 'Kui oled valmis, vajuta <b>Valmis</b>.', until: 'closeMenu' },
    ] },
    { t: 'Avaekraanil olevad rakendused', steps: [
      { type: 'info', target: '[data-app=phone]', text: '<b>Telefon:</b> sellega helistad ja vastad kõnedele.' },
      { type: 'info', target: '[data-app=browser]', text: () => `<b>${appName('browser')}</b> on brauser. Sellega pääsed internetti ja saad vaadata veebilehti.` },
      { type: 'info', target: '.dock [data-app=camera]', text: '<b>Kaamera:</b> sellega teed pilte ja videoid.' },
      { type: 'info', target: '[data-app=settings]', text: '<b>Seaded:</b> siin muudad telefoni seadeid, näiteks teksti suurust, helitugevust ja Wi-Fi ühendust.' },
      { type: 'info', target: '[data-app=messages]', text: '<b>Sõnumid:</b> siin loed ja kirjutad tekstisõnumeid (SMS).' },
      { type: 'info', target: '[data-app=contacts]', text: '<b>Kontaktid:</b> sinu telefoniraamat. Siin on inimeste nimed ja telefoninumbrid.' },
    ] },
    { t: 'Rakenduse avamine ja tagasi minek', steps: [
      { type: 'do', target: '.dock [data-app=camera]', text: 'Rakenduse avamiseks <b>vajuta selle ikoonile</b>. Ava <b>Kaamera</b>.', until: 'open:camera' },
      { type: 'info', target: '.camview', text: 'Kaamera on avatud. Nüüd saaksid teha pilti.' },
      { type: 'info', os: 'android', target: '.navbar', text: 'Ekraani all on <b>kolm nuppu</b>: ◀ läheb sammu tagasi, ● viib avaekraanile, ■ näitab hiljuti avatud rakendusi.' },
      { type: 'do', os: 'android', target: '.nav-home', text: 'Vajuta <b>ringikujulist nuppu ●</b>, et minna tagasi avaekraanile.', until: 'goHome' },
      { type: 'do', os: 'ios', target: '.homeind', text: 'Avakuvale naasmiseks <b>pühi ekraani alumisest servast üles</b>. Võid ka vajutada joonele.', until: 'goHome' },
      { type: 'info', target: '.home', text: 'Oled jälle avaekraanil. Nii saad igast rakendusest välja tulla.' },
    ] },
    { t: 'Kõik rakendused', steps: [
      { type: 'info', target: '.homegrid, .dock', text: 'Avaekraanil on ainult osa rakendusi. <b>Kõik rakendused</b> on eraldi kohas.' },
      { type: 'do', os: 'android', target: '.drawerhandle', text: '<b>Pühi ekraanil alt üles</b>, et näha kõiki rakendusi.', until: 'openDrawer' },
      { type: 'do', os: 'ios', target: '.pagedots', text: '<b>Pühi ekraanil vasakule</b>, kuni jõuad Rakenduste kogusse. Võid ka vajutada täppidele.', until: 'openDrawer' },
      { type: 'info', target: '.drawer .appgrid', text: () => isA() ? 'Siin on <b>kõik telefoni rakendused</b> tähestiku järjekorras.' : 'See on <b>Rakenduste kogu</b>. Siin on kõik telefoni rakendused.' },
      { type: 'do', os: 'android', target: '.nav-home', text: 'Vajuta <b>●</b>, et minna avaekraanile tagasi.', until: 'goHome' },
      { type: 'do', os: 'ios', target: '.homeind', text: '<b>Pühi alt üles</b>, et minna avakuvale tagasi.', until: 'goHome' },
    ] },
    { t: 'Rakenduse otsimine', setup() { if (isA()) P.scr = 'drawer'; }, steps: [
      { type: 'do', target: () => isA() ? '.searchbar' : '.searchpill', text: () => isA() ? 'Vajuta ülal <b>otsinguribale</b>.' : 'Vajuta nupule <b>Otsi</b>.', until: 'searchFocus' },

  act(name, el) {
    const d = el.dataset || {};
    switch (name) {
      case 'openConv': this.openChat(el.closest('[data-c]').dataset.c); return;
      case 'back': M.scr = 'list'; M.kb = false; M.attach = false; M.rec = null; return;
      case 'compose': M.scr = 'new'; return;
      case 'pickContact': { const id = d.contact, ct = CONTACTS.find(x => x.id === id);
        if (!M.convs[id]) { M.convs[id] = { n: ct.n, tm: 'nüüd', unread: false, msgs: [] }; M.order.unshift(id); }
        this.openChat(id); return; }
      case 'focus': M.kb = true; M.attach = false; if (M.K.mode === 'emoji') M.K.mode = 'abc'; return;
      case 'key': if (d.k === 'enter') return; M.input = applyKey(d.k, M.input, M.K); return d.k === 'emoji' ? 'emojiOpen' : (d.k === 'shift' ? 'shift' : (d.k === 'bksp' ? 'bksp' : (d.k === 'mode123' ? 'mode123' : null)));
      case 'emojiOpen': M.kb = true; M.K.mode = 'emoji'; return;
      case 'emojiPick': M.input += d.e; return;
      case 'send': {
        const c = M.convs[M.c];
        if (M.rec && M.rec.state === 'done') { c.msgs.push({ d: 'out', voice: true, dur: `0:${String(M.rec.t).padStart(2, '0')}` }); M.rec = null; return 'sent'; }
        if (!M.input.trim()) return;
        c.msgs.push({ d: 'out', t: M.input.trim() }); M.input = ''; M.K.mode = 'abc'; M.K.shift = false; return 'sent'; }
      case 'recStart': this.startRec(); return;
      case 'audio': M.attach = false; this.startRec(); return 'recStart';
      case 'recStop': M.rec.state = 'done'; clearInterval(M.recIv); return;
      case 'recDel': M.rec = null; clearInterval(M.recIv); return;
      case 'attach': M.attach = !M.attach; M.kb = false; return 'attachOpen';
      case 'longMsg': M.ctx = 'msg'; return;
      case 'copy': M.ctx = null; M.toast = 'Kood on kopeeritud'; later(() => { M.toast = ''; renderPhone(); }, 2600); return;
      case 'longConv': { const id = el.closest('[data-c]').dataset.c; if (isA()) M.sel = id; else M.ctx = 'conv:' + id; return; }
      case 'unsel': M.sel = null; return;
      case 'delAsk': M.dlg = 'del'; return;
      case 'confirmDel': { const id = M.sel || (M.ctx || '').slice(5); delete M.convs[id]; M.order = M.order.filter(x => x !== id); M.dlg = null; M.sel = null; M.ctx = null; return 'deleted'; }
      case 'cancelDlg': M.dlg = null; return;
      case 'chatMenu': if (isA()) M.menu = true; else M.sheet = true; return;
      case 'blockAsk': M.menu = false; M.sheet = false; M.dlg = 'block'; return;
      case 'confirmBlock': M.convs[M.c].blocked = true; M.dlg = null; M.kb = false; return 'blocked';
      case 'closeAll': M.ctx = null; M.menu = false; M.sheet = false; return;
    }
  },
  startRec() {
    M.kb = false; M.rec = { state: 'rec', t: 0 };
    clearInterval(M.recIv);
    M.recIv = setInterval(() => { if (!M.rec || M.rec.state !== 'rec' || !$('#ph')) { clearInterval(M.recIv); return; } M.rec.t = Math.min(59, M.rec.t + 1); const el = $('#ph .rec'); if (el) el.innerHTML = `<span class="dotr"></span>0:${String(M.rec.t).padStart(2, '0')} · Salvestan…`; }, 1000);
    L.timers.push(M.recIv);
  },

  const eyes = mood === 'happy' ? '<path d="M73 100 q7 -8 14 0M113 100 q7 -8 14 0" stroke="#2b2b2b" stroke-width="5" fill="none" stroke-linecap="round"/>'
    : '<circle cx="80" cy="99" r="6" fill="#2b2b2b"/><circle cx="120" cy="99" r="6" fill="#2b2b2b"/>';
  const mouth = mood === 'happy' ? '<path d="M82 128 q18 20 36 0z" fill="#B23B4E"/>'
    : mood === 'worried' ? '<path d="M84 138 q16 -14 32 0" stroke="#B23B4E" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M146 70 q6 10 0 14 q-6 -4 0 -14z" fill="#7FB8FF"/>'
      : '<path d="M86 132 h28" stroke="#B23B4E" stroke-width="5" stroke-linecap="round"/>';
  const bg = mood === 'happy' ? '#E5F6EC' : mood === 'worried' ? '#FDECEC' : '#EAF0FD';
  const hairBack = W ? '<circle cx="100" cy="42" r="20" fill="' + hair + '"/><path d="M48 104 q-6 -62 52 -66 q58 4 52 66 q-8 -34 -52 -40 q-44 6 -52 40z" fill="' + hair + '"/>'

  const extra = W ? '<circle cx="80" cy="99" r="15" fill="none" stroke="#7a5c8a" stroke-width="3.5"/><circle cx="120" cy="99" r="15" fill="none" stroke="#7a5c8a" stroke-width="3.5"/><path d="M95 99 h10" stroke="#7a5c8a" stroke-width="3.5"/>'
    : '<path d="M80 120 q20 -8 40 0 q-6 6 -20 4 q-14 2 -20 -4z" fill="' + hair + '"/>';
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${W ? 'Malvi' : 'Kalev'}"><circle cx="100" cy="100" r="98" fill="${bg}"/>
    <path d="M30 200 q8 -46 70 -50 q62 4 70 50z" fill="${top}"/><rect x="88" y="140" width="24" height="16" fill="${skin}"/>
    ${hairBack}<ellipse cx="100" cy="102" rx="46" ry="52" fill="${skin}"/>
    ${W ? '<path d="M56 92 q4 -44 44 -46 q40 2 44 46 q-14 -26 -44 -26 q-30 0 -44 26z" fill="' + hair + '"/>' : '<path d="M56 84 q6 -36 44 -38 q38 2 44 38 q-16 -18 -44 -18 q-28 0 -44 18z" fill="' + hair + '"/>'}
    <ellipse cx="54" cy="106" rx="7" ry="10" fill="${skin}"/><ellipse cx="146" cy="106" rx="7" ry="10" fill="${skin}"/>
    ${brows}${eyes}<path d="M100 104 q-5 12 2 14" stroke="#d9a688" stroke-width="4" fill="none" stroke-linecap="round"/>${extra}${mouth}</svg>`;
}

function renderTask() {

  } else if (T.kind === 'serp') {
    const ad = (k, sp, dom, url, tt, ds) => `<button class="ad ${C.pick === k ? 'pick' : ''}" data-pick="${k}"><div class="sp">${sp}</div><div class="dom">${dom}</div><div class="url">${url}</div><div class="tt">${tt}</div><div class="ds">${ds}</div></button>`;
    content = `<div class="mini ${S.os}"><div class="serp"><div class="gl">Otsing</div><div class="gq">${I.search.replace('<svg', '<svg style="width:14px;height:14px;vertical-align:-2px"')} coop pank</div>

      ${ad('real', 'Sponsitud', 'cooppank.ee', '<span class="sig" data-s="2">https://www.cooppank.ee</span>', 'Coop Pank Väikelaen - Intress alates 7,9%', 'Tagatiseta väikelaen kuni 25 000 €. Kiire ja lihtne.')}
    </div></div>`;
  } else if (T.kind === 'bank') {
    content = `<div class="mini ${S.os}"><div class="browser"><div class="addr">${I.lock}<span class="sig" data-s="1">https://jillniyomoto.com/seb/logon=set&amp;3e9bdf4</span></div>
      <div class="bankhead"><span class="bl">SEB</span><span>Internetipank</span></div>
      <div class="bankwarn"><span class="sig" data-s="2"><b>Oluline sõnum!</b> Täna testime SEPA Instant süsteemi. Kui olete oma online-kontole sisse loginud, nõutakse meie simulatsiooni ülekannet kontole NL**BUNQ**. Tähelepanu! See ülekanne on lihtsalt simulatsioon ja teie kontolt raha ei võeta!</span></div>
      <div class="banklogin"><h4><span class="sig" data-s="3">Login sisse</span></h4><div class="lb">Sisestage kasutajatunnus ja valige autentimisviis</div><div class="f"></div><div class="go">Jätka</div></div></div></div>`;
  } else if (T.kind === 'call') {
    const sgn = C.phase === 'a' ? `<div class="callsigns">${T.signs.slice(0, C.si + 1).map((s, i) => `<div class="${i === C.si ? 'cur' : ''}">${I.x.replace('<svg', '<svg style="width:18px;height:18px;flex:none"')}<span>${s[1]}</span></div>`).join('')}</div>` : '';
    content = `<div class="mini ${S.os}"><div class="callscr"><div class="cav">${I.person}</div><div class="cn">${T.caller}</div><div class="cs">${T.num} · kõne</div>
      <div class="player"><button id="play" aria-label="Kuula kõnet">${I.play}</button><div class="pb"><i id="pbar" style="width:${C.played ? 100 : 0}%"></i></div><div class="pt" id="ptime">${C.played ? '0:08' : '0:00'}</div></div>
      <div class="callnote">Näidisheli. Päris kõne salvestis lisatakse hiljem.</div>${sgn}</div></div>`;
  }
  let below = '';
  if (C.phase === 'q') {
    if (T.kind === 'serp') below = `<div class="speech" style="max-width:520px;width:100%;text-align:center">Vajuta tulemusele, millele ${P2.name} peaks vajutama.</div>`;
    else if (T.kind === 'call' && !C.played) below = `<div class="speech" style="max-width:520px;width:100%;text-align:center">Vajuta ▶, et kõnet kuulata.</div>`;
    else below = T.kind === 'bank'
      ? `<div class="answers"><button class="btn scam" data-ans="scam">Võlts</button><button class="btn safe" data-ans="safe">Päris</button></div>`
      : `<div class="answers"><button class="btn scam" data-ans="scam">Kelmus</button><button class="btn safe" data-ans="safe">Pole kelmus</button></div>`;
  } else {
    const what = { scam: T.kind === 'bank' ? 'See veebileht on võlts.' : (T.kind === 'call' ? 'See kõne oli kelmus.' : 'See sõnum on kelmus.'), safe: 'See sõnum ei ole kelmus.', real: 'Õige on alumine tulemus.' }[T.ans];
    below = `<div class="verdict ${C.correct ? 'r' : 'w'}">${C.correct ? I.check : I.x}<div>${C.correct ? 'Õige!' : 'Vale vastus.'} ${what}</div></div>`;
    const s = T.signs[C.si];
    if (s) {
      const good = T.ans === 'safe' ? s[3] !== 'warn' : s[3] === 'ok';
      const last = C.si >= T.signs.length - 1;
      const lbl = T.ans === 'safe' ? 'MIKS SEE ON PÄRIS' : 'OHUMÄRK';
      below += `<div class="signcard ${good ? 'good' : 'bad'}"><div class="sl">${s[3] === 'warn' ? 'HOIATUS' : (s[3] === 'ok' ? 'TURVALINE' : lbl)} ${C.si + 1}/${T.signs.length}</div><div class="sh">${s[1]}</div><div class="sb2">${s[2]}</div>

    }
  }
  app.innerHTML = `${topbar(`Küberturvalisus · Aita ${P2.ga}`)}<main class="task">
    <div class="chr"><div class="face">${face(C.who, C.mood)}</div><div style="flex:1"><div class="progress">${[0, 1, 2, 3].map(i => `<i class="${i <= C.i ? 'on' : ''}"></i>`).join('')}</div><div class="speech">${speech}</div></div></div>

  // sign highlights
  if (C.phase === 'a') {
    const safeKind = T.ans === 'safe';
    T.signs.slice(0, C.si + 1).forEach((s, i) => { if (!s[0]) return; $$(`.sig[data-s="${s[0]}"]`).forEach(e => { e.classList.add('show'); if (safeKind || s[3] === 'ok') e.classList.add('ok'); if (i === C.si) { e.classList.add('cur'); e.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }); });
  }
  $$('[data-ans]').forEach(b => b.onclick = () => answer(b.dataset.ans));
  $$('[data-pick]').forEach(b => b.onclick = () => { if (C.phase !== 'q') return; C.pick = b.dataset.pick; answer(b.dataset.pick); });
  const nb = $('#nsign'); if (nb) nb.onclick = nextSign;
  const pl = $('#play'); if (pl) pl.onclick = playCall;
}
function answer(a) {
  const T = CY[C.who].tasks[C.i];
  C.correct = a === T.ans; C.mood = C.correct ? 'happy' : 'worried'; C.phase = 'a'; C.si = 0;
  renderTask();
  setTimeout(() => { const v = $('.verdict'); v && v.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 50);
}
function nextSign() {
  const T = CY[C.who].tasks[C.i];
  if (C.si < T.signs.length - 1) { C.si++; renderTask(); $('.signcard') && $('.signcard').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
  if (C.i < 3) { C.i++; C.phase = 'q'; C.mood = 'neutral'; C.pick = null; C.si = -1; C.played = false; renderTask(); window.scrollTo(0, 0); return; }
  viewChecklist();
}
function playCall() {
  const pl = $('#play'); if (!pl || pl.dataset.on) return;
  pl.dataset.on = 1; pl.innerHTML = I.pause;
  let t = 0; const dur = 8;
  const iv = setInterval(() => {
    t += .25; const b = $('#pbar'), tm = $('#ptime');
    if (!b) { clearInterval(iv); return; }
    b.style.width = Math.min(100, t / dur * 100) + '%'; tm.textContent = '0:0' + Math.floor(t);
    if (t >= dur) { clearInterval(iv); C.played = true; if (C.phase === 'q') renderTask(); else { pl.innerHTML = I.play; delete pl.dataset.on; } }
  }, 250);
  cleanup = () => clearInterval(iv);
}

      { img: smsImg('LKF', 'Здравствуйте! Пожалуйста, подтвердите сообщение о ДТП: https://avarii.lkf.ee/ru/6QcCg4/ySd2ax/conclusion'), q: 'Liikluskindlustuse Fond palub kinnitada liiklusõnnetuse teadet. Kas see on kelmus?', o: ['Jah, see on kelmus', 'Ei, see ei ole kelmus'], a: 1, e: 'See ei ole kelmus: link viib lkf.ee lehele, mis on Liikluskindlustuse Fondi päris aadress.' },
      { img: smsImg('+66 96-630', 'Hea lapsevanem! Sinu laps on vanuses, mil ootame teda perearsti juurde laste plaanilisse tervisekontrolli. Broneeri aeg juba täna: www.terviseportaal.ee. Tervisekassa'), q: 'Kas see sõnum on kelmus?', o: ['Jah, see on kelmus', 'Ei, see ei ole kelmus'], a: 0, e: 'Number +66 ei ole Eesti number. Eesti numbrid algavad +372-ga.' },

let X = null;
function viewExam() {
  X = { user: '', topic: null, i: 0, score: 0, picked: null, qs: [] };
  app.innerHTML = `${topbar('Eksam')}<main class="exam">
    <h2>Logi sisse</h2><p class="lead">Logi sisse, et teha eksam ja näha oma tulemust.</p>
    <form id="lf"><div class="field"><label for="un">Kasutajanimi</label><input id="un" autocomplete="off"></div>
    <div class="field"><label for="pw">Parool</label><input id="pw" type="password" autocomplete="off"></div>
    <button class="btn block" type="submit">Logi sisse</button></form>
    <p class="note">Prototüüp: võid kirjutada ükskõik mida. Andmeid ei salvestata.</p></main>`;
  $('#lf').onsubmit = e => { e.preventDefault(); X.user = $('#un').value.trim(); examTopics(); };
}
function examTopics() {
  window.scrollTo(0, 0);
  app.innerHTML = `${topbar('Eksam')}<main class="exam">
    <h2>Tere${X.user ? ', ' + esc(X.user) : ''}!</h2><p class="lead">Vali teema, mille kohta tahad eksami teha. Igas eksamis on 10 küsimust.</p>
    <div class="topics">${Object.entries(EXAM).map(([k, t]) => `<button class="topicbtn" data-t="${k}"><span class="ti" style="background:${t.c}">${t.ic()}</span><span>${t.n}<small>10 küsimust</small></span></button>`).join('')}</div></main>`;
  $$('[data-t]').forEach(b => b.onclick = () => { X.topic = b.dataset.t; X.qs = EXAM[X.topic].q(); X.i = 0; X.score = 0; X.picked = null; examQ(); });
}
function examQ() {
  window.scrollTo(0, 0);
  const Q = X.qs[X.i], ans = X.picked !== null, L4 = 'ABCD';
  app.innerHTML = `${topbar('Eksam · ' + EXAM[X.topic].n)}<main class="exam">
    <div class="qhead"><span>Küsimus ${X.i + 1}/10</span><span>${EXAM[X.topic].n}</span></div>
    <div class="progress" style="margin-top:8px">${X.qs.map((_, i) => `<i class="${i <= X.i ? 'on' : ''}"></i>`).join('')}</div>
    ${Q.img || ''}<div class="qtext">${Q.q}</div>
    <div class="opts">${Q.o.map((o, i) => `<button class="opt ${ans && i === Q.a ? 'right' : ''} ${ans && i === X.picked && i !== Q.a ? 'wrong' : ''}" data-o="${i}" ${ans ? 'disabled' : ''}><span class="l">${L4[i]}</span>${esc(o)}</button>`).join('')}</div>
    ${ans ? `<div class="fb ${X.picked === Q.a ? 'r' : 'w'}">${X.picked === Q.a ? 'Õige!' : 'Vale vastus.'} ${Q.e}</div>
      <div style="margin-top:16px"><button class="btn block" id="nq">${X.i < 9 ? 'Järgmine küsimus →' : 'Vaata tulemust →'}</button></div>` : ''}
  </main>`;
  if (!ans) $$('[data-o]').forEach(b => b.onclick = () => { X.picked = +b.dataset.o; if (X.picked === Q.a) X.score++; examQ(); setTimeout(() => $('#nq') && $('#nq').scrollIntoView({ block: 'center', behavior: 'smooth' }), 50); });
  else $('#nq').onclick = () => { X.picked = null; if (X.i < 9) { X.i++; examQ(); } else examResult(); };
}
function examResult() {
  window.scrollTo(0, 0);
  const s = X.score;
  const msg = s >= 8 ? 'Väga tubli!' : s >= 5 ? 'Hea töö!' : 'Harjuta veel!';
  const sub = s >= 8 ? 'Sa tead sellest teemast väga palju.' : s >= 5 ? 'Enamik vastuseid oli õiged. Vaata maja õppetunnid veel kord üle.' : `Mine tagasi majja „${EXAM[X.topic].n}” ja proovi siis uuesti.`;
  app.innerHTML = `${topbar('Eksam · Tulemus')}<main class="exam"><div class="score">
    <div class="big">${s}/10</div><div class="of">õiget vastust</div><div class="msg">${msg}<div style="font-size:20px;font-weight:700;color:var(--ink2);margin-top:6px">${sub}</div></div></div>
    <div class="stack"><button class="btn block" id="again">Proovi uuesti</button><button class="btn ghost block" id="other">Vali teine teema</button><button class="btn ghost block" data-go="village">${I.home}Tagasi külasse</button></div></main>`;
  $('#again').onclick = () => { X.qs = EXAM[X.topic].q(); X.i = 0; X.score = 0; X.picked = null; examQ(); };
  $('#other').onclick = examTopics;
}

go('start');
</script>
